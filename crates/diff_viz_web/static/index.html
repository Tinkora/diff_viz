<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Local-first text and patch diff review tool">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b1117'/%3E%3Cpath d='M7 9h18M7 16h11M7 23h18' stroke='%2338d17c' stroke-width='3'/%3E%3C/svg%3E">
  <title>diff_viz | Local diff review</title>
  <style>
    :root {
      --ink: #e8edf2;
      --muted: #91a0af;
      --subtle: #667585;
      --canvas: #0b1117;
      --surface: #111a23;
      --surface-2: #17222d;
      --line: #263544;
      --line-strong: #3a4d60;
      --accent: #38d17c;
      --accent-strong: #1eb968;
      --accent-soft: rgba(56, 209, 124, .13);
      --danger: #ff7d7d;
      --danger-soft: rgba(255, 125, 125, .14);
      --warning: #e9bd63;
      --warning-soft: rgba(233, 189, 99, .14);
      --focus: #80bfff;
      --mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
      --sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.45;
    }
    button, select, input, textarea { font: inherit; }
    button, select { color: inherit; }
    button { cursor: pointer; }
    button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible,
    .mode-button:focus-visible, .view-button:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    .skip-link {
      position: fixed;
      left: 12px;
      top: -48px;
      z-index: 10;
      padding: 8px 12px;
      background: var(--accent);
      color: #07120c;
      font-weight: 600;
    }
    .skip-link:focus { top: 12px; }

    .app-shell { min-height: 100vh; display: flex; flex-direction: column; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 58px;
      padding: 10px clamp(16px, 3vw, 40px);
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border: 1px solid var(--accent);
      color: var(--accent);
      font: 600 12px var(--mono);
      letter-spacing: 0;
    }
    .brand-name { font: 600 16px var(--mono); white-space: nowrap; }
    .brand-meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warning); }
    .status.ready .status-dot { background: var(--accent); }
    .status.error .status-dot { background: var(--danger); }
    .locale-button, .ghost-button, .primary-button {
      border: 1px solid var(--line-strong);
      border-radius: 4px;
      background: transparent;
      min-height: 34px;
      padding: 6px 11px;
      font-size: 12px;
      transition: background .18s, border-color .18s, color .18s;
    }
    .locale-button:hover, .ghost-button:hover { background: var(--surface-2); border-color: var(--accent); }
    .primary-button { border-color: var(--accent-strong); background: var(--accent-strong); color: #06120b; font-weight: 700; }
    .primary-button:hover { background: var(--accent); }
    .primary-button:disabled { cursor: wait; opacity: .6; }

    main { width: min(1600px, 100%); margin: 0 auto; padding: 20px clamp(14px, 3vw, 40px) 32px; flex: 1; }
    .toolbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }
    .toolbar-group { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .field-label { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
    .field-label span { white-space: nowrap; }
    select, input[type=number] {
      min-height: 34px;
      border: 1px solid var(--line-strong);
      border-radius: 4px;
      background: var(--surface-2);
      color: var(--ink);
      padding: 5px 9px;
    }
    input[type=number] { width: 64px; }
    .segmented { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 4px; overflow: hidden; }
    .mode-button, .view-button {
      min-height: 32px;
      padding: 5px 11px;
      border: 0;
      border-right: 1px solid var(--line-strong);
      background: var(--surface-2);
      color: var(--muted);
      font-size: 12px;
    }
    .mode-button:last-child, .view-button:last-child { border-right: 0; }
    .mode-button:hover, .view-button:hover { color: var(--ink); background: #20303e; }
    .mode-button.active, .view-button.active { background: var(--accent-soft); color: var(--accent); }
    .toolbar-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }

    .input-workspace { margin-top: 18px; }
    .editor-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
    .editor-panel { min-width: 0; border: 1px solid var(--line); background: var(--surface); }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 42px;
      padding: 7px 11px;
      border-bottom: 1px solid var(--line);
    }
    .panel-title { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
    .panel-title::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--subtle); }
    .panel-title.modified::before { background: var(--accent); }
    .panel-action { border: 0; background: transparent; color: var(--muted); padding: 4px 6px; font-size: 12px; }
    .panel-action:hover { color: var(--accent); }
    textarea {
      display: block;
      width: 100%;
      min-height: 238px;
      resize: vertical;
      border: 0;
      padding: 14px;
      background: #091018;
      color: #d7e1eb;
      font: 13px/1.6 var(--mono);
      tab-size: 2;
    }
    textarea::placeholder { color: #506173; }
    .editor-meta { display: flex; justify-content: space-between; gap: 10px; padding: 7px 11px; border-top: 1px solid var(--line); color: var(--subtle); font-size: 11px; }

    .review-section { margin-top: 22px; border: 1px solid var(--line); background: var(--surface); }
    .review-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; padding: 11px 13px; border-bottom: 1px solid var(--line); }
    .review-title { display: flex; align-items: center; gap: 10px; margin: 0; font-size: 14px; }
    .review-title span { color: var(--muted); font: 11px var(--mono); }
    .stats { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; color: var(--muted); font: 11px var(--mono); }
    .stat { padding: 3px 7px; border: 1px solid var(--line); border-radius: 3px; }
    .stat.added { color: var(--accent); border-color: rgba(56,209,124,.4); }
    .stat.removed { color: var(--danger); border-color: rgba(255,125,125,.4); }
    .stat.modified { color: var(--warning); border-color: rgba(233,189,99,.4); }
    .output-scroll { min-height: 230px; max-height: 58vh; overflow: auto; }
    .output-message { display: grid; place-items: center; min-height: 230px; padding: 24px; color: var(--muted); font-size: 13px; text-align: center; }
    .output-message.error { color: var(--danger); }

    .diff-table { width: 100%; min-width: 700px; border-collapse: collapse; table-layout: fixed; font: 12px/1.6 var(--mono); }
    .diff-table col.line { width: 52px; }
    .diff-table col.sign { width: 24px; }
    .diff-table td { padding: 2px 9px; vertical-align: top; white-space: pre-wrap; overflow-wrap: anywhere; }
    .diff-table .line-no { color: var(--subtle); text-align: right; user-select: none; }
    .diff-table .sign { color: var(--subtle); text-align: center; user-select: none; }
    .diff-table tr.added { background: var(--accent-soft); }
    .diff-table tr.removed { background: var(--danger-soft); }
    .diff-table tr.modified { background: var(--warning-soft); }
    .diff-table tr.added .sign, .diff-table tr.added .content { color: var(--accent); }
    .diff-table tr.removed .sign, .diff-table tr.removed .content { color: var(--danger); }
    .diff-table tr.modified .sign, .diff-table tr.modified .content { color: var(--warning); }

    .unified-list, .json-list { padding: 12px 14px; font: 12px/1.65 var(--mono); }
    .unified-line, .json-line { display: grid; grid-template-columns: 24px minmax(0, 1fr); padding: 2px 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .unified-line .sign { color: var(--subtle); user-select: none; }
    .unified-line.added { color: var(--accent); background: var(--accent-soft); }
    .unified-line.removed { color: var(--danger); background: var(--danger-soft); }
    .unified-line.modified { color: var(--warning); background: var(--warning-soft); }
    .json-line { display: block; border-left: 2px solid transparent; }
    .json-line.added { color: var(--accent); background: var(--accent-soft); border-color: var(--accent); }
    .json-line.removed { color: var(--danger); background: var(--danger-soft); border-color: var(--danger); }
    .json-line.modified { color: var(--warning); background: var(--warning-soft); border-color: var(--warning); }

    .footer { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 14px clamp(16px, 3vw, 40px); border-top: 1px solid var(--line); color: var(--subtle); font-size: 11px; }
    .footer strong { color: var(--muted); font-weight: 500; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 820px) {
      .topbar { align-items: flex-start; }
      .top-actions { flex-wrap: wrap; justify-content: flex-end; }
      .toolbar { align-items: stretch; }
      .toolbar-group, .toolbar-actions { width: 100%; }
      .toolbar-actions > * { flex: 1 1 auto; }
      .editor-grid { grid-template-columns: 1fr; }
      textarea { min-height: 180px; }
      .output-scroll { max-height: none; }
    }
    @media (max-width: 480px) {
      main { padding: 14px 10px 24px; }
      .topbar { padding-inline: 12px; }
      .brand-meta, .status { display: none; }
      .toolbar-group { gap: 6px; }
      .mode-button, .view-button { padding-inline: 8px; }
      .field-label { width: 100%; justify-content: space-between; }
      .toolbar-actions > * { flex-basis: calc(50% - 4px); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#workspace" data-i18n="skip">Skip to workspace</a>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">dv</div>
        <div class="brand-name">diff_viz</div>
        <div class="brand-meta" data-i18n="tagline">local diff review</div>
      </div>
      <div class="top-actions">
        <div class="status" id="wasm-status" aria-live="polite"><span class="status-dot" aria-hidden="true"></span><span data-i18n="loading">Loading engine</span></div>
        <button class="locale-button" id="locale-toggle" type="button" aria-label="Switch language">中文</button>
      </div>
    </header>

    <main id="workspace">
      <section class="toolbar" aria-label="Diff controls">
        <div class="toolbar-group">
          <div class="segmented" role="group" aria-label="Diff granularity">
            <button class="mode-button active" type="button" data-mode="lines" data-i18n="lines">Lines</button>
            <button class="mode-button" type="button" data-mode="words" data-i18n="words">Words</button>
            <button class="mode-button" type="button" data-mode="chars" data-i18n="chars">Chars</button>
          </div>
          <div class="segmented" role="group" aria-label="Diff view">
            <button class="view-button active" type="button" data-view="side_by_side" data-i18n="side">Side by side</button>
            <button class="view-button" type="button" data-view="unified" data-i18n="unified">Unified</button>
            <button class="view-button" type="button" data-view="json_tree" data-i18n="json">JSON</button>
          </div>
          <label class="field-label"><span data-i18n="context">Context</span><input id="context-lines" type="number" min="0" max="99" value="3" inputmode="numeric" aria-label="Context lines"></label>
        </div>
        <div class="toolbar-actions">
          <button class="primary-button" id="btn-compare" type="button" data-i18n="compare">Compare</button>
          <button class="ghost-button" id="btn-export-patch" type="button" data-i18n="export">Export patch</button>
          <button class="ghost-button" id="btn-apply-patch" type="button" data-i18n="apply">Apply patch</button>
          <button class="ghost-button" id="btn-clear" type="button" data-i18n="clear">Clear</button>
        </div>
      </section>

      <section class="input-workspace" aria-label="Text inputs">
        <div class="editor-grid">
          <article class="editor-panel">
            <div class="panel-head">
              <div class="panel-title" data-i18n="original">Original</div>
              <button class="panel-action" id="btn-paste-left" type="button" data-i18n="pasteOriginal">Paste</button>
            </div>
            <label class="sr-only" for="left-input" data-i18n="originalInput">Original text</label>
            <textarea id="left-input" spellcheck="false" placeholder="Paste or type original text..."></textarea>
            <div class="editor-meta"><span id="left-count">0 chars</span><span data-i18n="localOnly">stays on this device</span></div>
          </article>
          <article class="editor-panel">
            <div class="panel-head">
              <div class="panel-title modified" data-i18n="modified">Modified</div>
              <button class="panel-action" id="btn-paste-right" type="button" data-i18n="pasteModified">Paste</button>
            </div>
            <label class="sr-only" for="right-input" data-i18n="modifiedInput">Modified text</label>
            <textarea id="right-input" spellcheck="false" placeholder="Paste or type modified text..."></textarea>
            <div class="editor-meta"><span id="right-count">0 chars</span><span data-i18n="localOnly">stays on this device</span></div>
          </article>
        </div>
      </section>

      <section class="review-section" aria-labelledby="review-heading">
        <div class="review-head">
          <h1 class="review-title" id="review-heading"><span data-i18n="review">Review</span><span id="review-mode">lines / side by side</span></h1>
          <div class="stats" id="stats" aria-live="polite"></div>
        </div>
        <div class="output-scroll" id="output-area">
          <div class="output-message" data-i18n="empty">Enter text on both sides, then compare.</div>
        </div>
      </section>
    </main>

    <footer class="footer"><strong>diff_viz</strong><span data-i18n="privacy">No uploads. No server. Your text stays local.</span><span>MIT</span></footer>
  </div>

  <script type="module">
    import init, { wasm_compute_diff, wasm_generate_unified_diff, wasm_apply_patch, wasm_json_diff } from './pkg/diff_viz_web.js';

    const $ = (id) => document.getElementById(id);
    const leftInput = $('left-input');
    const rightInput = $('right-input');
    const output = $('output-area');
    const status = $('wasm-status');
    const statusText = status.querySelector('span:last-child');
    const stats = $('stats');
    const modeButtons = [...document.querySelectorAll('[data-mode]')];
    const viewButtons = [...document.querySelectorAll('[data-view]')];
    const contextInput = $('context-lines');
    let mode = 'lines';
    let view = 'side_by_side';
    let lastResult = null;
    let locale = 'en';

    const copy = {
      en: { skip: 'Skip to workspace', tagline: 'local diff review', loading: 'Loading engine', ready: 'WASM ready', failed: 'Engine unavailable', lines: 'Lines', words: 'Words', chars: 'Chars', side: 'Side by side', unified: 'Unified', json: 'JSON', context: 'Context', compare: 'Compare', export: 'Export patch', apply: 'Apply patch', clear: 'Clear', original: 'Original', modified: 'Modified', pasteOriginal: 'Paste', pasteModified: 'Paste', originalInput: 'Original text', modifiedInput: 'Modified text', localOnly: 'stays on this device', review: 'Review', empty: 'Enter text on both sides, then compare.', same: 'No differences found.', error: 'Operation failed', charsLabel: 'chars', added: 'added', removed: 'removed', changed: 'changed', privacy: 'No uploads. No server. Your text stays local.', pasted: 'Text pasted', clipboard: 'Clipboard is unavailable', exported: 'Patch downloaded', applied: 'Patch applied to the modified side', cleared: 'Workspace cleared' },
      zh: { skip: '跳到工作区', tagline: '本地差异审查', loading: '正在加载引擎', ready: 'WASM 已就绪', failed: '引擎不可用', lines: '行', words: '词', chars: '字符', side: '并排', unified: '统一', json: 'JSON', context: '上下文', compare: '对比', export: '导出补丁', apply: '应用补丁', clear: '清空', original: '原始文本', modified: '修改后文本', pasteOriginal: '粘贴', pasteModified: '粘贴', originalInput: '原始文本', modifiedInput: '修改后文本', localOnly: '仅在本设备处理', review: '审查', empty: '在两侧输入文本，然后点击对比。', same: '未发现差异。', error: '操作失败', charsLabel: '字符', added: '新增', removed: '删除', changed: '修改', privacy: '不上传文本，不连接服务器，仅在本设备处理。', pasted: '已粘贴文本', clipboard: '剪贴板不可用', exported: '补丁已下载', applied: '补丁已应用到修改侧', cleared: '工作区已清空' }
    };
    const t = (key) => copy[locale][key] || key;

    function setStatus(kind, key) { status.className = `status ${kind}`; statusText.textContent = t(key); }
    function setMessage(key, error = false) { output.replaceChildren(); const node = document.createElement('div'); node.className = `output-message${error ? ' error' : ''}`; node.textContent = key; output.append(node); }
    function normalizeError(error) { return error && typeof error === 'object' && error.message ? `${error.code || 'ERROR'}: ${error.message}` : String(error); }
    function setActive(buttons, active) { buttons.forEach((button) => button.classList.toggle('active', button.dataset.mode === active || button.dataset.view === active)); }
    function updateReviewLabel() { const viewKey = view === 'side_by_side' ? 'side' : view === 'json_tree' ? 'json' : 'unified'; $('review-mode').textContent = `${t(mode)} / ${t(viewKey)}`; }
    function updateCounts() { $('left-count').textContent = `${leftInput.value.length.toLocaleString()} ${t('charsLabel')}`; $('right-count').textContent = `${rightInput.value.length.toLocaleString()} ${t('charsLabel')}`; }
    function node(tag, text, className) { const element = document.createElement(tag); if (className) element.className = className; if (text !== undefined) element.textContent = text; return element; }

    function renderStats(lines) {
      stats.replaceChildren();
      const counts = { added: 0, removed: 0, modified: 0 };
      lines.forEach((line) => { if (line.kind in counts) counts[line.kind] += 1; });
      Object.entries(counts).forEach(([kind, count]) => { if (!count) return; stats.append(node('span', `${count} ${t(kind === 'modified' ? 'changed' : kind)}`, `stat ${kind}`)); });
    }

    function renderSideBySide(lines) {
      const wrap = node('div');
      const table = node('table', undefined, 'diff-table');
      table.setAttribute('aria-label', 'Side-by-side diff');
      const colgroup = node('colgroup'); ['line', 'sign', '', 'line', 'sign', ''].forEach((name) => colgroup.append(node('col', undefined, name))); table.append(colgroup);
      const tbody = node('tbody');
      lines.forEach((line) => {
        const row = node('tr', undefined, line.kind);
        const left = line.left_text || ''; const right = line.right_text || '';
        row.append(node('td', line.left_line_no || '', 'line-no'), node('td', line.kind === 'removed' ? '-' : line.kind === 'modified' ? '~' : '', 'sign'), node('td', left, 'content'));
        row.append(node('td', line.right_line_no || '', 'line-no'), node('td', line.kind === 'added' ? '+' : line.kind === 'modified' ? '~' : '', 'sign'), node('td', right, 'content'));
        tbody.append(row);
      });
      table.append(tbody); wrap.append(table); return wrap;
    }

    function renderUnified(lines) {
      const wrap = node('div', undefined, 'unified-list');
      lines.forEach((line) => {
        const addLine = (kind, sign, text) => { const row = node('div', undefined, `unified-line ${kind}`); row.append(node('span', sign, 'sign'), node('span', text)); wrap.append(row); };
        if (line.kind === 'unchanged') addLine('unchanged', ' ', line.left_text || '');
        if (line.kind === 'added') addLine('added', '+', line.right_text || '');
        if (line.kind === 'removed') addLine('removed', '-', line.left_text || '');
        if (line.kind === 'modified') { addLine('removed', '-', line.left_text || ''); addLine('added', '+', line.right_text || ''); }
      });
      return wrap;
    }

    function renderJson(lines) {
      const wrap = node('div', undefined, 'json-list');
      lines.forEach((line) => {
        const row = node('div', line.kind === 'modified' ? `- ${line.left_text || ''}    + ${line.right_text || ''}` : `${line.kind === 'added' ? '+' : line.kind === 'removed' ? '-' : ' '} ${line.left_text || line.right_text || ''}`, `json-line ${line.kind}`);
        wrap.append(row);
      });
      return wrap;
    }

    function render(lines) {
      output.replaceChildren(); renderStats(lines);
      if (!lines.length) { setMessage(t('same')); return; }
      output.append(view === 'side_by_side' ? renderSideBySide(lines) : view === 'unified' ? renderUnified(lines) : renderJson(lines));
    }

    async function compare() {
      updateCounts();
      if (!leftInput.value && !rightInput.value) { setMessage(t('empty')); return; }
      setMessage(locale === 'en' ? 'Computing…' : '正在计算…');
      try {
        lastResult = view === 'json_tree' ? wasm_json_diff(leftInput.value, rightInput.value) : wasm_compute_diff(leftInput.value, rightInput.value, mode);
        render(lastResult);
      } catch (error) { lastResult = null; renderStats([]); setMessage(`${t('error')}: ${normalizeError(error)}`, true); }
    }

    async function pasteInto(target) {
      try { target.value = await navigator.clipboard.readText(); updateCounts(); setMessage(t('pasted')); }
      catch { setMessage(t('clipboard'), true); }
    }

    $('btn-compare').addEventListener('click', compare);
    $('btn-paste-left').addEventListener('click', () => pasteInto(leftInput));
    $('btn-paste-right').addEventListener('click', () => pasteInto(rightInput));
    $('btn-clear').addEventListener('click', () => { leftInput.value = ''; rightInput.value = ''; lastResult = null; updateCounts(); renderStats([]); setMessage(t('cleared')); });
    leftInput.addEventListener('input', updateCounts); rightInput.addEventListener('input', updateCounts);
    modeButtons.forEach((button) => button.addEventListener('click', () => { mode = button.dataset.mode; setActive(modeButtons, mode); updateReviewLabel(); if (lastResult) compare(); }));
    viewButtons.forEach((button) => button.addEventListener('click', () => { view = button.dataset.view; setActive(viewButtons, view); updateReviewLabel(); if (lastResult) compare(); }));
    document.addEventListener('keydown', (event) => { if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') { event.preventDefault(); compare(); } });

    $('btn-export-patch').addEventListener('click', () => {
      try {
        const patch = wasm_generate_unified_diff(leftInput.value, rightInput.value, 'original', 'modified', Math.max(0, Math.min(99, Number(contextInput.value) || 0)));
        const link = document.createElement('a'); link.href = URL.createObjectURL(new Blob([patch], { type: 'text/plain' })); link.download = 'diff.patch'; link.click(); URL.revokeObjectURL(link.href); setMessage(t('exported'));
      } catch (error) { setMessage(`${t('error')}: ${normalizeError(error)}`, true); }
    });
    $('btn-apply-patch').addEventListener('click', () => {
      try { rightInput.value = wasm_apply_patch(leftInput.value, rightInput.value); updateCounts(); setMessage(t('applied')); compare(); }
      catch (error) { setMessage(`${t('error')}: ${normalizeError(error)}`, true); }
    });

    $('locale-toggle').addEventListener('click', () => {
      locale = locale === 'en' ? 'zh' : 'en'; document.documentElement.lang = locale === 'en' ? 'en' : 'zh-CN'; $('locale-toggle').textContent = locale === 'en' ? '中文' : 'English'; $('locale-toggle').setAttribute('aria-label', locale === 'en' ? 'Switch language' : '切换语言'); document.querySelectorAll('[data-i18n]').forEach((element) => { element.textContent = t(element.dataset.i18n); }); updateCounts(); updateReviewLabel(); setStatus(status.classList.contains('ready') ? 'ready' : status.classList.contains('error') ? 'error' : '', status.classList.contains('ready') ? 'ready' : status.classList.contains('error') ? 'failed' : 'loading');
    });

    updateCounts(); updateReviewLabel();
    try { await init(); setStatus('ready', 'ready'); }
    catch (error) { setStatus('error', 'failed'); setMessage(`${t('error')}: ${normalizeError(error)}`, true); }
  </script>
</body>
</html>
