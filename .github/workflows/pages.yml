name: Deploy Pages

'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Rust and WebAssembly quality
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/quality.yml

  documentation:
    name: Documentation quality
    permissions:
      contents: read
    uses: ./.github/workflows/docs-quality.yml

  supply-chain:
    name: Supply-chain audit
    permissions:
      contents: read
    uses: ./.github/workflows/supply-chain.yml

  assemble:
    name: Assemble static site
    needs: [quality, documentation, supply-chain]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified WASM package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wasm-package

      - name: Assemble Pages source
        shell: bash
        env:
          WASM_PACKAGE: ${{ runner.temp }}/wasm-package
        run: |
          set -euo pipefail
          static="crates/diff_viz_web/static"
          [[ -d "$static" && ! -L "$static" && -f "$static/index.html" ]]
          [[ -d "$WASM_PACKAGE" && ! -L "$WASM_PACKAGE" ]]
          [[ -f "$WASM_PACKAGE/diff_viz_web.js" && -f "$WASM_PACKAGE/diff_viz_web_bg.wasm" ]]
          if find "$static" "$WASM_PACKAGE" -type l -print -quit | grep -q .; then
            echo "Pages input contains a symbolic link" >&2
            exit 1
          fi
          if find "$static" "$WASM_PACKAGE" ! -type f ! -type d -print -quit | grep -q .; then
            echo "Pages input contains a special file" >&2
            exit 1
          fi
          if find "$WASM_PACKAGE" -mindepth 2 -print -quit | grep -q .; then
            echo "WASM package must contain top-level files only" >&2
            exit 1
          fi
          mkdir -p dist/pkg
          find "$static" -mindepth 1 -maxdepth 1 ! -name pkg -exec cp -a -- {} dist/ \;
          while IFS= read -r -d '' file; do
            case "${file##*/}" in
              .gitignore) continue ;;
              package.json|diff_viz_web.js|diff_viz_web_bg.wasm|*.d.ts|README.md|LICENSE|LICENSE.*) ;;
              *) echo "Unexpected WASM package file: ${file##*/}" >&2; exit 1 ;;
            esac
            cp -- "$file" dist/pkg/
          done < <(find "$WASM_PACKAGE" -maxdepth 1 -type f -print0)
          [[ -f dist/index.html && -f dist/pkg/diff_viz_web.js && -f dist/pkg/diff_viz_web_bg.wasm ]]

      - name: Upload Pages source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-source-${{ github.run_id }}
          path: dist
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1

  deploy:
    name: Deploy Pages
    needs: assemble
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
      pages: write
    uses: Tinkora/.github/.github/workflows/reusable-pages.yml@af8ae92c2083c55283187be0d6a1ffba7740df86 # Tinkora organization baseline
    with:
      source-artifact-name: pages-source-${{ github.run_id }}
      source-subdirectory: .
